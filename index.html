<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alessandro Ivashkevich — AI & Data Science Portfolio</title>
<meta name="description" content="Alessandro Ivashkevich — MSc Data Science & Business Analytics at ESSEC & CentraleSupélec. AI agents, machine learning, optimization. Open to final-year internships from September 2026.">
<meta property="og:title" content="Alessandro Ivashkevich — AI & Data Science Portfolio">
<meta property="og:description" content="AI agents, machine learning research, and optimization projects. Available for a final-year internship from September 2026.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --bg-soft: #0b0d1d;
    --card: rgba(255, 255, 255, 0.035);
    --card-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(129, 140, 248, 0.55);
    --text: #e9ecf8;
    --muted: #9aa3c2;
    --faint: #6b7394;
    --a1: #38bdf8;
    --a2: #818cf8;
    --a3: #e879f9;
    --grad: linear-gradient(100deg, var(--a1), var(--a2) 50%, var(--a3));
    --font-head: 'Space Grotesk', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    overflow-x: hidden;
  }

  ::selection { background: rgba(129, 140, 248, 0.4); }

  /* ---------- Background layers ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: -2;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.35;
    z-index: -1;
    pointer-events: none;
  }
  .orb-1 {
    width: 55vmax; height: 55vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle, rgba(56,189,248,0.5), transparent 65%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 50vmax; height: 50vmax;
    bottom: -20vmax; right: -12vmax;
    background: radial-gradient(circle, rgba(232,121,249,0.4), transparent 65%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: 35vmax; height: 35vmax;
    top: 40%; left: 55%;
    background: radial-gradient(circle, rgba(129,140,248,0.35), transparent 65%);
    animation: drift1 38s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8vmax, 6vmax) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1.1); }
    to   { transform: translate(-7vmax, -8vmax) scale(0.95); }
  }

  .cursor-glow {
    position: fixed;
    width: 480px; height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(129,140,248,0.10), transparent 60%);
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s;
    opacity: 0;
  }

  /* ---------- Layout ---------- */
  .container {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  section { padding: 110px 0; scroll-margin-top: 90px; }

  .section-head { margin-bottom: 56px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--a2);
    display: block;
    margin-bottom: 12px;
  }
  h2 {
    font-family: var(--font-head);
    font-size: clamp(32px, 5vw, 46px);
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .grad-text {
    background: var(--grad);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: sheen 6s linear infinite;
  }
  @keyframes sheen {
    to { background-position: 200% center; }
  }

  /* ---------- Nav ---------- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(5, 6, 15, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .progress {
    position: absolute;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: var(--grad);
  }
  nav .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    padding-bottom: 16px;
    gap: 16px;
  }
  .logo {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }
  .logo span { color: var(--a2); }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-links { display: flex; gap: 24px; list-style: none; }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 500;
    transition: color 0.25s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: -6px;
    width: 0; height: 2px;
    background: var(--grad);
    transition: width 0.25s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

  .language-switcher { display: flex; gap: 6px; }
  .lang-btn {
    padding: 5px 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--faint);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.25s;
  }
  .lang-btn:hover { border-color: var(--a2); color: var(--text); }
  .lang-btn.active {
    background: var(--grad);
    color: #05060f;
    border-color: transparent;
    font-weight: 500;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 140px 0 80px;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--a1);
    margin-bottom: 22px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .hero-eyebrow::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 12px #4ade80;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .hero h1 {
    font-family: var(--font-head);
    font-size: clamp(44px, 8vw, 88px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 18px;
  }
  .hero-role {
    font-family: var(--font-mono);
    font-size: clamp(17px, 2.5vw, 24px);
    color: var(--muted);
    margin-bottom: 26px;
    min-height: 1.6em;
  }
  .hero-role .typed { color: var(--text); }
  .hero-role .caret {
    display: inline-block;
    width: 2px;
    background: var(--a3);
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .hero-tagline {
    max-width: 640px;
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 42px;
  }
  .cta-buttons { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn {
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.25s, box-shadow 0.25s, background 0.25s, color 0.25s;
    cursor: pointer;
    display: inline-block;
  }
  .btn-primary {
    background: var(--grad);
    background-size: 200% auto;
    color: #05060f;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 34px rgba(129, 140, 248, 0.4);
    background-position: right center;
  }
  .btn-ghost {
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--card);
  }
  .btn-ghost:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    background: var(--card-hover);
  }

  .scroll-hint {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .scroll-hint::after {
    content: '';
    width: 1px;
    height: 40px;
    background: linear-gradient(var(--a2), transparent);
    animation: fall 1.8s ease-in-out infinite;
  }
  @keyframes fall {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  /* ---------- Stats ---------- */
  .stats {
    padding: 0 0 30px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s;
  }
  .stat:hover { transform: translateY(-4px); border-color: var(--border-hover); }
  .stat-value {
    font-family: var(--font-head);
    font-size: 42px;
    font-weight: 700;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 14px; color: var(--muted); }

  /* ---------- About ---------- */
  .about-content {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 64px;
    align-items: start;
  }
  .about-photo {
    position: relative;
    border-radius: 22px;
    padding: 3px;
    background: var(--grad);
    background-size: 300% 300%;
    animation: sheen 8s linear infinite;
  }
  .about-photo img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    object-position: center top;
    border-radius: 19px;
  }
  .about-text p { margin-bottom: 20px; font-size: 17px; color: var(--muted); }
  .about-text p strong { color: var(--text); font-weight: 600; }
  .values { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .chip {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    transition: all 0.25s;
  }
  .chip:hover { border-color: var(--a2); color: var(--text); transform: translateY(-2px); }

  /* ---------- Timeline (experience) ---------- */
  .timeline { position: relative; max-width: 860px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 8px; bottom: 8px;
    width: 2px;
    background: linear-gradient(var(--a1), var(--a2), var(--a3));
    opacity: 0.4;
  }
  .timeline-item {
    position: relative;
    padding-left: 52px;
    margin-bottom: 44px;
  }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-dot {
    position: absolute;
    left: 0;
    top: 8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--a2);
    box-shadow: 0 0 16px rgba(129, 140, 248, 0.6);
  }
  .timeline-dot::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--grad);
  }
  .xp-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 32px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
  }
  .xp-card:hover {
    transform: translateX(6px);
    border-color: var(--border-hover);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  .xp-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .xp-role { font-family: var(--font-head); font-size: 22px; font-weight: 600; }
  .xp-period {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--a1);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .xp-company { color: var(--a2); font-weight: 600; font-size: 15px; margin-bottom: 16px; }
  .xp-company span { color: var(--faint); font-weight: 400; }
  .xp-card ul { list-style: none; }
  .xp-card li {
    position: relative;
    padding-left: 22px;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 15px;
  }
  .xp-card li::before {
    content: '▹';
    position: absolute;
    left: 0;
    color: var(--a3);
  }

  /* ---------- Education ---------- */
  .edu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 22px;
  }
  .edu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 28px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s;
    display: flex;
    flex-direction: column;
  }
  .edu-card:hover { transform: translateY(-6px); border-color: var(--border-hover); }
  .edu-period {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--a1);
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }
  .edu-school { font-family: var(--font-head); font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .edu-degree { color: var(--a2); font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .edu-card ul { list-style: none; margin-top: auto; }
  .edu-card li {
    position: relative;
    padding-left: 20px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .edu-card li::before { content: '▹'; position: absolute; left: 0; color: var(--a3); }

  /* ---------- Projects ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }
  .filter-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.5px;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.25s;
  }
  .filter-btn:hover { border-color: var(--a2); color: var(--text); }
  .filter-btn.active {
    background: var(--grad);
    color: #05060f;
    border-color: transparent;
    font-weight: 500;
  }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 22px;
  }
  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, opacity 0.35s;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .project-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .project-card.hide { display: none; }
  .project-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .project-card h3 {
    font-family: var(--font-head);
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
  }
  .badge {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-gold {
    background: linear-gradient(100deg, #fbbf24, #f59e0b);
    color: #1c1400;
    font-weight: 500;
  }
  .badge-violet {
    background: rgba(129, 140, 248, 0.18);
    border: 1px solid rgba(129, 140, 248, 0.5);
    color: #b4bcfb;
  }
  .badge-green {
    background: rgba(74, 222, 128, 0.14);
    border: 1px solid rgba(74, 222, 128, 0.45);
    color: #86efac;
  }
  .project-card p { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; flex-grow: 1; }
  .tech-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tech-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.22);
    color: #7dd3fc;
  }
  .project-links a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: color 0.25s;
  }
  .project-links a:hover { color: var(--a3); }

  /* ---------- Skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
  }
  .skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s;
  }
  .skill-card:hover { transform: translateY(-5px); border-color: var(--border-hover); }
  .skill-card h3 {
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .skill-card h3 .ico { font-size: 20px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tags .tech-tag {
    background: rgba(129, 140, 248, 0.08);
    border-color: rgba(129, 140, 248, 0.25);
    color: #b4bcfb;
    font-size: 12px;
    padding: 6px 13px;
  }

  /* ---------- Honors ---------- */
  .honors-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
  }
  .honor-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s, border-color 0.3s;
  }
  .honor-card:hover { transform: translateY(-5px); border-color: var(--border-hover); }
  .honor-year {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--a1);
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .honor-card h3 { font-family: var(--font-head); font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .honor-card p { color: var(--muted); font-size: 14px; }

  /* ---------- Contact ---------- */
  .contact-box {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 64px 40px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }
  .contact-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--grad);
  }
  .contact-box h2 { margin-bottom: 18px; }
  .contact-box > p { color: var(--muted); font-size: 17px; margin-bottom: 36px; }
  .contact-email {
    display: inline-block;
    font-family: var(--font-head);
    font-size: clamp(17px, 3.4vw, 24px);
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    margin-bottom: 36px;
    background: var(--grad);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    transition: filter 0.25s;
    word-break: break-all;
  }
  .contact-email:hover { filter: brightness(1.3); }
  .social-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .social-links a {
    color: var(--muted);

/* =====================================================
   INTERACTIONS
   ===================================================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia('(pointer: fine)').matches;

// --- language switch ---
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    localStorage.setItem('lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
  btn.classList.toggle('active', btn.dataset.lang === lang);
});

// --- mobile menu ---
const mobileToggle = document.getElementById('mobileToggle');
const navLinksEl = document.getElementById('navLinks');
mobileToggle.addEventListener('click', () => navLinksEl.classList.toggle('open'));
navLinksEl.addEventListener('click', (e) => {

});

// --- typing effect ---
let typeTimer = null;
function startTyping() {
  clearTimeout(typeTimer);
  const el = document.getElementById('typed');
  if (!el) return;
  const phrases = HERO.roles[lang] || HERO.roles.en;
  if (reduceMotion) { el.textContent = phrases[0]; return; }
  let pi = 0, ci = 0, deleting = false;
  (function tick() {
    const phrase = phrases[pi];
    el.textContent = phrase.slice(0, ci);
    let delay = deleting ? 26 : 52;
    if (!deleting && ci === phrase.length) { delay = 2100; deleting = true; }
    else if (deleting && ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; delay = 350; }
    else ci += deleting ? -1 : 1;
    typeTimer = setTimeout(tick, delay);
  })();
}

// --- reveal on scroll + counters ---
function animateCounter(el) {
  const target = parseInt(el.dataset.count, 10);
  const prefix = el.dataset.prefix || '';
  const suffix = el.dataset.suffix || '';
  if (reduceMotion) { el.textContent = prefix + target + suffix; return; }
  const dur = 1400;
  const start = performance.now();
  (function step(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + Math.round(target * eased) + suffix;
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

let revealObserver = null;
function observeReveals() {
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('in');
      en.target.querySelectorAll('[data-count]').forEach(animateCounter);
      if (en.target.hasAttribute('data-count')) animateCounter(en.target);
      revealObserver.unobserve(en.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}

// --- dynamic bindings after each render ---
function bindDynamic() {
  // project filters
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.project-card').forEach(card => {
        card.classList.toggle('hide', activeFilter !== 'all' && card.dataset.cat !== activeFilter);
      });
    });
  });

  // 3D tilt on project cards
  if (finePointer && !reduceMotion) {
    document.querySelectorAll('.project-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        const rx = ((e.clientY - r.top) / r.height - 0.5) * -6;
        const ry = ((e.clientX - r.left) / r.width - 0.5) * 6;
        card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    });
  }
}

window.addEventListener('scroll', () => {

  const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;

  let current = '';

    const sec = document.getElementById(n.id);

// --- starfield canvas ---
(function starfield() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [];
  let mx = 0, my = 0;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.min(160, Math.floor(w * h / 12000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      z: Math.random() * 0.7 + 0.3,           // depth → parallax + size
      tw: Math.random() * Math.PI * 2,        // twinkle phase
      v: Math.random() * 0.08 + 0.02          // drift speed
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  if (reduceMotion) {
    // static render
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.z, 0, 7); ctx.fill(); });
    return;
  }

  window.addEventListener('mousemove', (e) => {
    mx = (e.clientX / w - 0.5) * 14;
    my = (e.clientY / h - 0.5) * 14;
  }, { passive: true });

  (function frame(tms) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.y -= s.v * s.z;
      if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
      const alpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(tms / 900 + s.tw));
      ctx.fillStyle = `rgba(200, 210, 255, ${alpha * s.z})`;
      ctx.beginPath();
      ctx.arc(s.x + mx * s.z, s.y + my * s.z, s.z * 1.15, 0, 7);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  })(0);
})();

// initial paint
render();
